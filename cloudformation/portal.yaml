AWSTemplateFormatVersion: "2010-09-09"
Description: PMO Executive Portal - private S3 origin and CloudFront distribution.

Parameters:
  Environment:
    Type: String
    AllowedValues:
      - dev
      - prod

  DashboardId:
    Type: String
    Default: pmo-executive-dashboard-v2

Resources:
  PortalBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub pmo-executive-portal-${Environment}-${AWS::AccountId}-${AWS::Region}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Application
          Value: PMO-Executive-Portal
        - Key: Environment
          Value: !Ref Environment

  PortalOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Description: !Sub Private access to PMO portal ${Environment}
        Name: !Sub pmo-executive-portal-${Environment}-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  PortalResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub pmo-executive-portal-${Environment}-security
        Comment: Security headers for the PMO executive portal.
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            ContentSecurityPolicy: >-
              default-src 'self';
              frame-src https://*.quicksight.aws.amazon.com;
              img-src 'self' data:;
              style-src 'self' 'unsafe-inline';
              script-src 'self' https://unpkg.com;
              connect-src 'self' https:;
              object-src 'none';
              base-uri 'self';
              frame-ancestors 'none'
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Override: true

  PortalDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub PMO Executive Portal ${Environment}
        DefaultRootObject: index.html
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        Origins:
          - Id: PortalS3Origin
            DomainName: !GetAtt PortalBucket.RegionalDomainName
            OriginAccessControlId: !Ref PortalOriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          TargetOriginId: PortalS3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref PortalResponseHeadersPolicy
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
        PriceClass: PriceClass_100
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
          MinimumProtocolVersion: TLSv1.2_2021
      Tags:
        - Key: Application
          Value: PMO-Executive-Portal
        - Key: Environment
          Value: !Ref Environment

  PortalBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PortalBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action:
              - s3:GetObject
            Resource: !Sub ${PortalBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${PortalDistribution}

Outputs:
  Environment:
    Value: !Ref Environment

  PortalBucketName:
    Value: !Ref PortalBucket

  DistributionId:
    Value: !Ref PortalDistribution

  DistributionDomainName:
    Value: !GetAtt PortalDistribution.DomainName

  PortalUrl:
    Value: !Sub https://${PortalDistribution.DomainName}

  QuickSightAllowedDomain:
    Description: Add this HTTPS domain to QuickSight Domains and Embedding.
    Value: !Sub https://${PortalDistribution.DomainName}

  DashboardId:
    Value: !Ref DashboardId
