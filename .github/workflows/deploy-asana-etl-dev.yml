name: Deploy Asana ETL DEV

on:
  workflow_dispatch:
    inputs:
      run_task:
        description: Run and validate the DEV ETL after publishing the image
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: asana-etl-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, publish and validate DEV
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      AWS_REGION: us-east-1
      AWS_ROLE_ARN: arn:aws:iam::664858858204:role/pmo-ip-github-dev-deployment
      ECR_REPOSITORY: pmo-ip/asana-exporter-dev
      STACK_NAME: pmo-ip-asana-etl-dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: pmo-ip-dev-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sign in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and publish immutable image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          docker build \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "${REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}" \
            --tag "${REGISTRY}/${ECR_REPOSITORY}:latest" \
            .
          docker push "${REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          docker push "${REGISTRY}/${ECR_REPOSITORY}:latest"

      - name: Enforce ECR critical vulnerability gate
        run: |
          set -euo pipefail
          aws ecr wait image-scan-complete \
            --repository-name "${ECR_REPOSITORY}" \
            --image-id "imageTag=${GITHUB_SHA}"

          critical="$(
            aws ecr describe-image-scan-findings \
              --repository-name "${ECR_REPOSITORY}" \
              --image-id "imageTag=${GITHUB_SHA}" \
              --query "imageScanFindings.findingSeverityCounts.CRITICAL" \
              --output text
          )"
          high="$(
            aws ecr describe-image-scan-findings \
              --repository-name "${ECR_REPOSITORY}" \
              --image-id "imageTag=${GITHUB_SHA}" \
              --query "imageScanFindings.findingSeverityCounts.HIGH" \
              --output text
          )"
          [ "${critical}" = "None" ] && critical=0
          [ "${high}" = "None" ] && high=0

          echo "Critical findings: ${critical}"
          echo "High findings: ${high}"
          test "${critical}" -eq 0

      - name: Run isolated DEV task
        if: ${{ inputs.run_task }}
        id: run
        run: |
          set -euo pipefail
          output() {
            aws cloudformation describe-stacks \
              --stack-name "${STACK_NAME}" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue | [0]" \
              --output text
          }

          cluster="$(output ClusterName)"
          task_definition="$(output TaskDefinitionArn)"
          security_group="$(output SecurityGroupId)"
          subnets="$(output SubnetIds)"
          network="awsvpcConfiguration={subnets=[${subnets}],securityGroups=[${security_group}],assignPublicIp=ENABLED}"

          task_arn="$(
            aws ecs run-task \
              --cluster "${cluster}" \
              --task-definition "${task_definition}" \
              --launch-type FARGATE \
              --network-configuration "${network}" \
              --query "tasks[0].taskArn" \
              --output text
          )"

          test -n "${task_arn}"
          test "${task_arn}" != "None"
          echo "cluster=${cluster}" >> "${GITHUB_OUTPUT}"
          echo "task_arn=${task_arn}" >> "${GITHUB_OUTPUT}"

          stopped=false
          for attempt in $(seq 1 900)
          do
            status="$(
              aws ecs describe-tasks \
                --cluster "${cluster}" \
                --tasks "${task_arn}" \
                --query "tasks[0].lastStatus" \
                --output text
            )"
            if [ "${status}" = "STOPPED" ]; then
              stopped=true
              break
            fi
            sleep 10
          done
          test "${stopped}" = "true"

          exit_code="$(
            aws ecs describe-tasks \
              --cluster "${cluster}" \
              --tasks "${task_arn}" \
              --query "tasks[0].containers[0].exitCode" \
              --output text
          )"
          test "${exit_code}" = "0"

      - name: Validate contractual DEV objects
        if: ${{ inputs.run_task }}
        run: |
          set -euo pipefail
          bucket="$(
            aws cloudformation describe-stacks \
              --stack-name "${STACK_NAME}" \
              --query "Stacks[0].Outputs[?OutputKey=='DataBucketName'].OutputValue | [0]" \
              --output text
          )"

          for key in \
            projects/projects.csv \
            tasks/tasks.csv \
            project_metrics/project_metrics.csv
          do
            size="$(
              aws s3api head-object \
                --bucket "${bucket}" \
                --key "${key}" \
                --query ContentLength \
                --output text
            )"
            test "${size}" -gt 0
            echo "OK s3://${bucket}/${key} (${size} bytes)"
          done

      - name: Write deployment summary
        if: always()
        run: |
          {
            echo "## PMO-IP Asana ETL DEV"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Region: \`${AWS_REGION}\`"
            echo "- Scheduler: disabled"
            echo "- Production resources changed: no"
          } >> "${GITHUB_STEP_SUMMARY}"
