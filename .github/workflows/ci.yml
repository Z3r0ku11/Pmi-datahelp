name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src:src/exporter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall -q src scripts

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Validate portal JavaScript
        run: node --check portal/app.js

      - name: Validate semantic model
        shell: pwsh
        run: ./quicksight/validate-semantic-model.ps1
