AWSTemplateFormatVersion: '2010-09-09'
Description: 'PMI-DataHelp API Backend Infrastructure - Lambda Functions and API Gateway'

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Environment name
  
  ProjectName:
    Type: String
    Default: pmi-datahelp
    Description: Project name for resource naming
  
  MainStackName:
    Type: String
    Description: Name of the main infrastructure stack
  
  CognitoStackName:
    Type: String
    Description: Name of the Cognito stack

Mappings:
  EnvironmentMap:
    dev:
      LogLevel: DEBUG
      ReservedConcurrency: 10
      Timeout: 30
      MemorySize: 512
    staging:
      LogLevel: INFO
      ReservedConcurrency: 20
      Timeout: 30
      MemorySize: 1024
    prod:
      LogLevel: INFO
      ReservedConcurrency: 50
      Timeout: 30
      MemorySize: 1024

Resources:
  # IAM Role for Lambda Functions
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-lambda-execution-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !Sub
                    - '${ContentBucketArn}/*'
                    - ContentBucketArn: !Sub 'arn:aws:s3:::${MainStackName}-ContentBucket'
                  - !Sub
                    - '${ContentBucketArn}'
                    - ContentBucketArn: !Sub 'arn:aws:s3:::${MainStackName}-ContentBucket'
              - Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                Resource: '*'
        - PolicyName: CognitoAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:AdminGetUser
                  - cognito-idp:AdminCreateUser
                  - cognito-idp:AdminSetUserPassword
                  - cognito-idp:AdminUpdateUserAttributes
                  - cognito-idp:ListUsers
                Resource:
                  - !Sub 
                    - '${UserPoolArn}'
                    - UserPoolArn: !Sub 'arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoStackName}-UserPool'
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !GetAtt SessionsTable.Arn
                  - !GetAtt AuditTable.Arn

  # DynamoDB Tables
  SessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-sessions-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: sessionId
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: sessionId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: userId-index
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  AuditTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-audit-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: auditId
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: auditId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: userId-timestamp-index
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: timestamp
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # Lambda Functions
  Phase1APIFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-phase1-api-${Environment}'
      Runtime: python3.12
      Handler: phase1_handler.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        ZipFile: |
          import json
          import boto3
          import logging
          from typing import Dict, Any
          
          logger = logging.getLogger()
          logger.setLevel(logging.INFO)
          
          def lambda_handler(event: Dict[str, Any], context) -> Dict[str, Any]:
              """
              Phase 1 API Handler - Educational Portal Backend
              """
              logger.info(f"Phase 1 API Request: {json.dumps(event)}")
              
              try:
                  # CORS headers
                  headers = {
                      'Content-Type': 'application/json',
                      'Access-Control-Allow-Origin': '*',
                      'Access-Control-Allow-Methods': 'GET,POST,PUT,DELETE,OPTIONS',
                      'Access-Control-Allow-Headers': 'Content-Type,Authorization'
                  }
                  
                  # Handle preflight requests
                  if event.get('httpMethod') == 'OPTIONS':
                      return {
                          'statusCode': 200,
                          'headers': headers,
                          'body': json.dumps({'message': 'CORS preflight'})
                      }
                  
                  path = event.get('path', '')
                  method = event.get('httpMethod', 'GET')
                  
                  # Route handling
                  if path.startswith('/api/modules'):
                      return handle_modules(event, method)
                  elif path.startswith('/api/tools'):
                      return handle_tools(event, method)
                  elif path.startswith('/api/resources'):
                      return handle_resources(event, method)
                  elif path.startswith('/api/auth'):
                      return handle_auth(event, method)
                  else:
                      return {
                          'statusCode': 404,
                          'headers': headers,
                          'body': json.dumps({'error': 'Endpoint not found'})
                      }
                      
              except Exception as e:
                  logger.error(f"Error in Phase 1 API: {str(e)}")
                  return {
                      'statusCode': 500,
                      'headers': headers,
                      'body': json.dumps({'error': 'Internal server error'})
                  }
          
          def handle_modules(event, method):
              """Handle learning modules API"""
              # Mock implementation
              return {
                  'statusCode': 200,
                  'headers': {'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*'},
                  'body': json.dumps({
                      'success': True,
                      'data': [],
                      'message': 'Modules endpoint - implementation pending'
                  })
              }
          
          def handle_tools(event, method):
              """Handle interactive tools API"""
              # Mock implementation
              return {
                  'statusCode': 200,
                  'headers': {'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*'},
                  'body': json.dumps({
                      'success': True,
                      'data': [],
                      'message': 'Tools endpoint - implementation pending'
                  })
              }
          
          def handle_resources(event, method):
              """Handle resources API"""
              # Mock implementation
              return {
                  'statusCode': 200,
                  'headers': {'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*'},
                  'body': json.dumps({
                      'success': True,
                      'data': [],
                      'message': 'Resources endpoint - implementation pending'
                  })
              }
          
          def handle_auth(event, method):
              """Handle authentication API"""
              # Mock implementation
              return {
                  'statusCode': 200,
                  'headers': {'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*'},
                  'body': json.dumps({
                      'success': True,
                      'data': {'token': 'mock-token', 'user': {'id': '1', 'name': 'Demo User'}},
                      'message': 'Auth endpoint - implementation pending'
                  })
              }
      Environment:
        Variables:
          LOG_LEVEL: !FindInMap [EnvironmentMap, !Ref Environment, LogLevel]
          ENVIRONMENT: !Ref Environment
          CONTENT_BUCKET: !ImportValue
            Fn::Sub: '${MainStackName}-ContentBucket'
          SESSIONS_TABLE: !Ref SessionsTable
          AUDIT_TABLE: !Ref AuditTable
      MemorySize: !FindInMap [EnvironmentMap, !Ref Environment, MemorySize]
      Timeout: !FindInMap [EnvironmentMap, !Ref Environment, Timeout]
      ReservedConcurrencyLimit: !FindInMap [EnvironmentMap, !Ref Environment, ReservedConcurrency]
      TracingConfig:
        Mode: Active
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Phase
          Value: '1'

  Phase2APIFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-phase2-api-${Environment}'
      Runtime: python3.12
      Handler: phase2_handler.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        ZipFile: |
          import json
          import boto3
          import logging
          from typing import Dict, Any
          
          logger = logging.getLogger()
          logger.setLevel(logging.INFO)
          
          def lambda_handler(event: Dict[str, Any], context) -> Dict[str, Any]:
              """
              Phase 2 API Handler - Corporate PMO Dashboard Backend
              """
              logger.info(f"Phase 2 API Request: {json.dumps(event)}")
              
              try:
                  # CORS headers
                  headers = {
                      'Content-Type': 'application/json',
                      'Access-Control-Allow-Origin': '*',
                      'Access-Control-Allow-Methods': 'GET,POST,PUT,DELETE,OPTIONS',
                      'Access-Control-Allow-Headers': 'Content-Type,Authorization'
                  }
                  
                  # Handle preflight requests
                  if event.get('httpMethod') == 'OPTIONS':
                      return {
                          'statusCode': 200,
                          'headers': headers,
                          'body': json.dumps({'message': 'CORS preflight'})
                      }
                  
                  # Require authentication for Phase 2
                  auth_header = event.get('headers', {}).get('Authorization', '')
                  if not auth_header.startswith('Bearer '):
                      return {
                          'statusCode': 401,
                          'headers': headers,
                          'body': json.dumps({'error': 'Unauthorized - Token required'})
                      }
                  
                  path = event.get('path', '')
                  method = event.get('httpMethod', 'GET')
                  
                  # Route handling
                  if path.startswith('/api/portfolio'):
                      return handle_portfolio(event, method)
                  elif path.startswith('/api/projects'):
                      return handle_projects(event, method)
                  elif path.startswith('/api/resources'):
                      return handle_resources_mgmt(event, method)
                  elif path.startswith('/api/risks'):
                      return handle_risks(event, method)
                  elif path.startswith('/api/reports'):
                      return handle_reports(event, method)
                  elif path.startswith('/api/auth'):
                      return handle_auth(event, method)
                  else:
                      return {
                          'statusCode': 404,
                          'headers': headers,
                          'body': json.dumps({'error': 'Endpoint not found'})
                      }
                      
              except Exception as e:
                  logger.error(f"Error in Phase 2 API: {str(e)}")
                  return {
                      'statusCode': 500,
                      'headers': headers,
                      'body': json.dumps({'error': 'Internal server error'})
                  }
          
          def handle_portfolio(event, method):
              """Handle portfolio management API"""
              # Mock implementation with real-looking data
              return {
                  'statusCode': 200,
                  'headers': {'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*'},
                  'body': json.dumps({
                      'success': True,
                      'data': {
                          'totalProjects': 48,
                          'activeProjects': 48,
                          'atRiskProjects': 8,
                          'delayedProjects': 5,
                          'portfolioHealth': 92,
                          'totalBudget': 3800000,
                          'plannedHours': 24650,
                          'activeClients': 18,
                          'activePMs': 9,
                          'pmUtilization': 82
                      },
                      'timestamp': '2026-09-01T12:00:00Z'
                  })
              }
          
          def handle_projects(event, method):
              """Handle project management API"""
              # Mock implementation
              return {
                  'statusCode': 200,
                  'headers': {'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*'},
                  'body': json.dumps({
                      'success': True,
                      'data': [],
                      'message': 'Projects endpoint - implementation pending'
                  })
              }
          
          def handle_resources_mgmt(event, method):
              """Handle resource management API"""
              # Mock implementation
              return {
                  'statusCode': 200,
                  'headers': {'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*'},
                  'body': json.dumps({
                      'success': True,
                      'data': [],
                      'message': 'Resource management endpoint - implementation pending'
                  })
              }
          
          def handle_risks(event, method):
              """Handle risk management API"""
              # Mock implementation
              return {
                  'statusCode': 200,
                  'headers': {'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*'},
                  'body': json.dumps({
                      'success': True,
                      'data': {
                          'totalRisks': 16,
                          'highRisks': 4,
                          'mediumRisks': 6,
                          'lowRisks': 6
                      },
                      'message': 'Risk management endpoint - implementation pending'
                  })
              }
          
          def handle_reports(event, method):
              """Handle reports API"""
              # Mock implementation
              return {
                  'statusCode': 200,
                  'headers': {'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*'},
                  'body': json.dumps({
                      'success': True,
                      'data': [],
                      'message': 'Reports endpoint - implementation pending'
                  })
              }
          
          def handle_auth(event, method):
              """Handle corporate authentication API"""
              # Mock implementation
              return {
                  'statusCode': 200,
                  'headers': {'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*'},
                  'body': json.dumps({
                      'success': True,
                      'data': {'token': 'mock-pmo-token', 'user': {'id': '1', 'name': 'PMO Director', 'role': 'executive'}},
                      'message': 'Corporate auth endpoint - implementation pending'
                  })
              }
      Environment:
        Variables:
          LOG_LEVEL: !FindInMap [EnvironmentMap, !Ref Environment, LogLevel]
          ENVIRONMENT: !Ref Environment
          CONTENT_BUCKET: !ImportValue
            Fn::Sub: '${MainStackName}-ContentBucket'
          SESSIONS_TABLE: !Ref SessionsTable
          AUDIT_TABLE: !Ref AuditTable
      MemorySize: !FindInMap [EnvironmentMap, !Ref Environment, MemorySize]
      Timeout: !FindInMap [EnvironmentMap, !Ref Environment, Timeout]
      ReservedConcurrencyLimit: !FindInMap [EnvironmentMap, !Ref Environment, ReservedConcurrency]
      TracingConfig:
        Mode: Active
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Phase
          Value: '2'

  # API Gateway
  APIGateway:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub '${ProjectName}-api-${Environment}'
      Description: PMI-DataHelp API Gateway for both phases
      EndpointConfiguration:
        Types:
          - REGIONAL
      Policy:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action:
              - execute-api:Invoke
            Resource:
              - !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:*/*'
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # Lambda Permissions
  Phase1APIPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt Phase1APIFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub '${APIGateway}/*/ANY/*'

  Phase2APIPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt Phase2APIFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub '${APIGateway}/*/ANY/*'

Outputs:
  Phase1APIFunctionArn:
    Description: ARN of Phase 1 API Lambda Function
    Value: !GetAtt Phase1APIFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-Phase1APIFunctionArn'

  Phase2APIFunctionArn:
    Description: ARN of Phase 2 API Lambda Function
    Value: !GetAtt Phase2APIFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-Phase2APIFunctionArn'

  APIGatewayId:
    Description: API Gateway ID
    Value: !Ref APIGateway
    Export:
      Name: !Sub '${AWS::StackName}-APIGatewayId'

  APIGatewayURL:
    Description: API Gateway URL
    Value: !Sub 'https://${APIGateway}.execute-api.${AWS::Region}.amazonaws.com'
    Export:
      Name: !Sub '${AWS::StackName}-APIGatewayURL'

  SessionsTableName:
    Description: Name of the Sessions DynamoDB table
    Value: !Ref SessionsTable
    Export:
      Name: !Sub '${AWS::StackName}-SessionsTable'

  AuditTableName:
    Description: Name of the Audit DynamoDB table
    Value: !Ref AuditTable
    Export:
      Name: !Sub '${AWS::StackName}-AuditTable'